[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coopeval"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "gurobipy",
    "inspect-ai",
    "matplotlib",
    "networkx",
    "numpy",
    "openai",
    "pandas",
    "plotly",
    "protobuf",
    "pydantic-settings",
    "pyyaml",
    "scipy",
    "seaborn",
    "sentencepiece",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "black",
    "ipykernel",
    "isort",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
